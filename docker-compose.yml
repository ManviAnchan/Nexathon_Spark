services:
  keynova-db:
    image: postgres:16-alpine
    container_name: keynova_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: keynova
      POSTGRES_PASSWORD: keynova_password
      POSTGRES_DB: keynova_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keynova -d keynova_db"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
